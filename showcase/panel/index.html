<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Roamies</title>
<link rel="stylesheet" href="../onboarding/onboarding.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="frame shut" id="frame">
<header class="head">
  <!-- The Roamie itself, in its current look: it reacts to what's going on (decorative; the status line says it). -->
  <canvas class="avatar" id="avatar" aria-hidden="true"></canvas>
  <div class="head-text">
    <div class="who">
      <span class="led" id="led" aria-hidden="true"></span>
      <h1 id="title">Roamies</h1>
      <span class="ver" id="ver"></span>
      <!-- Updates, on every page: Check for updates, then Update to x (it installs and restarts), then Done. -->
      <button class="px btn ghost mini" type="button" id="head-update" hidden></button>
      <button class="px btn ghost mini" type="button" id="head-lang" aria-label="Switch language">RU</button>
      <!-- Quit, at the end of the row: the first press turns it into Confirm for a few seconds. -->
      <button class="link danger arm head-quit" type="button" id="head-quit" aria-pressed="false" aria-label="Выйти из Roamies"><span class="no" aria-hidden="true">Выход</span><span class="yes" aria-hidden="true">Точно?</span></button>
      <!-- Close, last on the row: some Linux desktops never say the panel lost focus, so clicking away can't close it (#135). -->
      <button class="link ibtn head-close" type="button" id="head-close" aria-label="Закрыть панель" data-tip="Закрыть (Esc)"></button>
    </div>
    <p class="by" id="by">От Ken Kai</p>
    <!-- What it's doing and the model, for screen readers; on screen the LED shows it. -->
    <p class="sr-only" id="now" role="status" aria-live="polite"></p>
    <p class="saying" id="saying" aria-hidden="true"></p>
  </div>
</header>

<div class="split">
  <!-- One page per concern: what's going on, what it remembers, then a page for each group of settings. -->
  <nav class="side" aria-label="Панель">
    <ul class="nav">
      <li><button class="px navi" type="button" id="nav-home" data-page="home" aria-controls="pane-home" aria-current="page">Главная<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-memory" data-page="memory" aria-controls="pane-memory">Память<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-abilities" data-page="abilities" aria-controls="pane-abilities">Навыки<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-model" data-page="model" aria-controls="pane-model">Модель<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-appearance" data-page="appearance" aria-controls="pane-appearance">Внешний вид<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-speaking" data-page="speaking" aria-controls="pane-speaking">Озвучка<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-listening" data-page="listening" aria-controls="pane-listening">Слух<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-shortcuts" data-page="shortcuts" aria-controls="pane-shortcuts">Клавиши<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-general" data-page="general" aria-controls="pane-general">Общие<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-whatsnew" data-page="whatsnew" aria-controls="pane-whatsnew">Что нового<span class="dot" aria-hidden="true"></span></button></li>
    </ul>
  </nav>
  <main class="body">
    <section class="pane" id="pane-home" aria-labelledby="nav-home"></section>
    <section class="pane" id="pane-memory" aria-labelledby="nav-memory" hidden></section>
    <section class="pane" id="pane-abilities" aria-labelledby="nav-abilities" hidden></section>
    <section class="pane" id="pane-model" aria-labelledby="nav-model" hidden></section>
    <section class="pane" id="pane-appearance" aria-labelledby="nav-appearance" hidden></section>
    <section class="pane" id="pane-speaking" aria-labelledby="nav-speaking" hidden></section>
    <section class="pane" id="pane-listening" aria-labelledby="nav-listening" hidden></section>
    <section class="pane" id="pane-shortcuts" aria-labelledby="nav-shortcuts" hidden></section>
    <section class="pane" id="pane-general" aria-labelledby="nav-general" hidden></section>
    <section class="pane" id="pane-whatsnew" aria-labelledby="nav-whatsnew" hidden></section>
  </main>
</div>
<p class="note" id="note" role="status" aria-live="polite" hidden></p>
<!-- Tooltip: what a choice is for and what it costs. The same text is each option's description for screen readers. -->
<div class="px tip" id="tip" aria-hidden="true" hidden></div>

</div>
<script src="../roamies/core.js"></script>
<script src="../roamies/jarvis.js"></script>
<script src="../roamies/people.js"></script>
<script src="../roamies/10-dither.js"></script>
<script>
(() => {
  const lang = localStorage.getItem('roamies_ui_lang') === 'ru' ? 'ru' : 'en';
  document.documentElement.lang = lang;
  if (lang === 'en') {
    const q = document.getElementById('head-quit');
    if (q) {
      q.setAttribute('aria-label', 'Quit Roamies');
      q.querySelector('.no').textContent = 'Quit';
      q.querySelector('.yes').textContent = 'Confirm';
    }
    const c = document.getElementById('head-close');
    if (c) { c.setAttribute('aria-label', 'Close the panel'); c.dataset.tip = 'Close (Esc)'; }
    const by = document.getElementById('by');
    if (by) by.textContent = 'By Ken Kai';
    const nav = { home: 'Home', memory: 'Memory', abilities: 'Abilities', model: 'Model', appearance: 'Appearance', speaking: 'Speaking', listening: 'Listening', shortcuts: 'Shortcuts', general: 'General', whatsnew: "What's new" };
    for (const [id, label] of Object.entries(nav)) {
      const b = document.getElementById('nav-' + id);
      if (b && b.firstChild) b.firstChild.textContent = label;
    }
  }
  const hl = document.getElementById('head-lang');
  if (hl) {
    hl.textContent = lang === 'ru' ? 'EN' : 'RU';
    hl.title = lang === 'ru' ? 'Switch to English' : 'Переключить на русский';
    hl.addEventListener('click', () => {
      const next = lang === 'ru' ? 'en' : 'ru';
      localStorage.setItem('roamies_ui_lang', next);
      window.__TAURI__?.core?.invoke('sidecar_send', { msg: { type: 'menu', id: `uilang:${next}` } }).catch(() => {});
      location.reload();
    });
  }
  const s = document.createElement('script');
  s.src = lang === 'ru' ? 'panel.ru.js' : 'panel.en.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
